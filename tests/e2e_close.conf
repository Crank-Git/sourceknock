# e2e integration test config (issue #18) - close_on_connect mode.
#
# The daemon runs inside the test network namespace and captures on the
# `e2e-s` veth peer. The knock is encoded in the client's source ports. After
# the sequence arms the port, the first connection to the service port closes
# it again.

[global]
interface = e2e-s

[trigger:e2e]
service = e2e
port = 2222                 # hidden service port to open
protocol = tcp
sequence = 1100,2200,3300   # ordered source-port knock
window = 5                  # whole sequence must finish within N seconds
mode = close_on_connect     # close the port on the first connection
fallback_ttl = 30           # safety max open time
