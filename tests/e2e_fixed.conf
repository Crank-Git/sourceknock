# e2e integration test config (issue #18) - fixed_ttl mode.
#
# The daemon runs inside the test network namespace and captures on the
# `e2e-s` veth peer. The knock is encoded in the client's source ports.

[global]
interface = e2e-s

[trigger:e2e]
service = e2e
port = 2222                 # hidden service port to open
protocol = tcp
sequence = 1100,2200,3300   # ordered source-port knock
window = 5                  # whole sequence must finish within N seconds
mode = fixed_ttl            # port stays open for `duration` seconds
duration = 4                # seconds port stays open
fallback_ttl = 30           # safety max open time
