# example sourceknock configuration
#
# The knock is encoded in the CLIENT'S SOURCE PORT. Keep the destination fixed
# (here, anything - the daemon only looks at source port + source IP).
#
# Comments start with # or ;, on their own line or after a value.

[global]
interface = eth0
# close_on = interface (default) closes ports only on the trigger's interface;
# close_on = all closes them on every interface.
# close_on = all

[trigger:ssh]
service = ssh
port = 22
protocol = tcp
sequence = 7000,8000,9000
window = 5
mode = fixed_ttl
duration = 30
fallback_ttl = 300
