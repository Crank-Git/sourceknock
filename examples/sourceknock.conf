# example sourceknock configuration
#
# The knock is encoded in the CLIENT'S SOURCE PORT. Keep the destination fixed
# (here, anything - the daemon only looks at source port + source IP).
#
# NOTE: the INI parser strips only full-line comments (lines starting with #
# or ;). Inline comments after a value are NOT stripped, so keep value lines
# free of trailing '#' or ';'.

[global]
interface = eth0

[trigger:ssh]
service = ssh
port = 22
protocol = tcp
sequence = 7000,8000,9000
window = 5
mode = fixed_ttl
duration = 30
fallback_ttl = 300
