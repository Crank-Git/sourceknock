# example sourceknock configuration
#
# The knock is encoded in the CLIENT'S SOURCE PORT. Keep the destination fixed
# (here, anything — the daemon only looks at source port + source IP).

[global]
interface = eth0

[trigger:ssh]
service = ssh
port = 22                 # hidden service port to open
protocol = tcp
sequence = 7000,8000,9000 # ordered source-port knock
window = 5                # whole sequence must finish within N seconds
mode = fixed_ttl          # fixed_ttl | close_on_connect | permanent
duration = 30             # seconds port stays open (fixed_ttl)
fallback_ttl = 300        # safety max open time (close_on_connect)
