# SSH access behind sourceknock.
#
# The knock is encoded in the CLIENT'S SOURCE ports (7000, 8000, 9000). The
# daemon opens TCP/22 for your source IP and closes it as soon as the SSH
# connection is established (close_on_connect), with a 300s safety net in case
# a client never connects.
#
# Knock from a client with the bundled client, then connect:
#   sourceknock-knock server 7000,8000,9000 && ssh user@server
# (it sends each step from the right source port, in order; the destination
# port only matters if the trigger sets knock_port.)

[global]
interface = eth0

[trigger:ssh]
service = ssh
port = 22
protocol = tcp
sequence = 7000,8000,9000
window = 5
mode = close_on_connect
fallback_ttl = 300
