# Time-based knock for SSH: the sequence comes from a shared secret and the
# clock, changes every 30 seconds, and each one works once (like a 2FA code).
#
# Create the secret and let the daemon read it:
#   head -c 32 /dev/urandom | base64 | sudo tee /etc/sourceknock/ssh.key >/dev/null
#   sudo chown root:sourceknock /etc/sourceknock/ssh.key
#   sudo chmod 0640 /etc/sourceknock/ssh.key
# Copy it to the client and knock with:
#   sourceknock-knock -K ~/.config/sourceknock/ssh.key -p 4444 server.example.com
# Both clocks must be synced (NTP).

[global]
interface = eth0

[trigger:ssh]
port = 22
protocol = tcp
secret_file = /etc/sourceknock/ssh.key
knock_port = 4444
window = 5
mode = fixed_ttl
duration = 30
