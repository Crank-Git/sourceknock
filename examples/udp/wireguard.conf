# WireGuard access behind sourceknock.
#
# WireGuard is UDP, so there is no TCP handshake: the port opens on knock and
# stays open until the first UDP packet to the WireGuard port arrives
# (close_on_connect), or until fallback_ttl expires. Pick a WireGuard port in
# 1..65535 that does not clash with other services (51820 is shown as an
# example).
#
# Because UDP has no handshake, the arming knock itself does NOT close the port
# the instant it opens - only a later UDP packet to the service port does.

[global]
interface = eth0

[trigger:wireguard]
service = wireguard
port = 51820
protocol = udp
sequence = 5000,5100,5200
window = 5
mode = close_on_connect
fallback_ttl = 60
