# Web access behind sourceknock.
#
# Knock in the CLIENT'S SOURCE ports to open HTTP and HTTPS for your source IP,
# then close on the first connection. `port` accepts a comma-separated list, so
# both 80 and 443 open together on a successful knock.
#
# NOTE: the INI parser does not strip inline comments from values, so keep
# values free of trailing '#' or ';'.

[global]
interface = eth0

[trigger:web]
service = web
port = 80, 443
protocol = tcp
sequence = 1100,2200,3300
window = 5
mode = close_on_connect
fallback_ttl = 120
